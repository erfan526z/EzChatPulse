<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EzChatPulse — Admin</title>
<style>
  :root {
    --bg: #0b0f1e;
    --panel: #141a30;
    --border: rgba(255, 255, 255, 0.08);
    --text: #e6e9f5;
    --muted: #8b93ad;
    --grad: linear-gradient(135deg, #7c3aed, #a855f7);
    --green: #34d399;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .card .num { font-size: 24px; font-weight: 700; }
  .card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .card .ok { color: var(--green); font-size: 13px; font-weight: 600; }
  .card .off { color: var(--red); font-size: 13px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.4px; }
  tr:last-child td { border-bottom: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--green); }
  .dot.off { background: var(--muted); }
  button {
    border: none;
    border-radius: 9px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    background: var(--grad);
    color: #fff;
  }
  button.ghost { background: rgba(255,255,255,0.08); color: var(--text); }
  button.danger { background: rgba(239,68,68,0.15); color: var(--red); }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  input {
    background: #0d1226;
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    padding: 8px 12px;
    font: inherit;
    font-size: 13.5px;
  }
  .hidden { display: none !important; }
  #login-box { max-width: 320px; margin: 80px auto; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  #login-box h2 { margin: 0; font-size: 18px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel); border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; font-size: 13.5px; z-index: 10; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>EzChatPulse Admin</h1>
  <div class="sub">Monitor &amp; manage — only accessible to users on the <code>ADMIN_USERNAMES</code> list.</div>

  <div id="login-box">
    <h2>Sign in</h2>
    <input id="a-user" placeholder="Username" autocomplete="username" />
    <input id="a-pass" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="a-login">Sign in</button>
    <div class="muted" style="font-size:12px">Must be an admin account (set via ADMIN_USERNAMES env).</div>
  </div>

  <div id="app" class="hidden">
    <div class="toolbar">
      <button id="btn-reg" class="danger">…</button>
      <span class="muted" style="font-size:12px">registration kill-switch</span>
      <button id="btn-captcha">…</button>
      <input id="captcha-threshold" type="number" min="0" max="50" value="3" style="width:56px" title="Failed logins before a captcha is required (0 = never)" />
      <span class="muted" style="font-size:12px">captcha after N fails</span>
      <button id="btn-search-mode">…</button>
      <span style="flex:1"></span>
      <input id="cleanup-days" type="number" min="0" max="3650" value="30" style="width:70px" title="Delete flagged messages older than this many days" />
      <button id="btn-cleanup" class="danger">Purge deleted &gt; N days</button>
      <button id="btn-refresh" class="ghost">Refresh</button>
      <button id="btn-logout" class="ghost">Log out</button>
    </div>

    <div class="cards" id="cards"></div>

    <div class="toolbar" style="margin:18px 0 8px">
      <strong style="font-size:14px">Backups</strong>
      <button id="btn-backup-now">Backup now</button>
      <span class="muted" id="backup-schedule" style="font-size:12px"></span>
      <span style="flex:1"></span>
    </div>
    <table>
      <thead><tr><th>Backup</th><th>Size</th><th>Created</th><th></th></tr></thead>
      <tbody id="backup-rows"></tbody>
    </table>

    <table>
      <thead><tr><th>User</th><th>Username</th><th>Status</th><th>Last seen</th><th>Joined</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
(() => {
  const TOKEN_KEY = 'chatpulse.admin.token';
  const $ = (s) => document.querySelector(s);
  const loginBox = $('#login-box');
  const app = $('#app');

  function toast(msg, err) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    el.style.borderColor = err ? 'rgba(239,68,68,0.5)' : 'rgba(52,211,153,0.5)';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  async function api(path, opts = {}) {
    const headers = { 'content-type': 'application/json', ...(opts.headers || {}) };
    const token = localStorage.getItem(TOKEN_KEY);
    if (token) headers.authorization = 'Bearer ' + token;
    const res = await fetch(path, { ...opts, headers });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      if (res.status === 401 || res.status === 403) { showLogin(); }
      throw new Error(body.error || res.statusText);
    }
    return body;
  }

  function fmtBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }
  function fmtAgo(ts) {
    if (!ts) return '—';
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 60) return 'now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  }
  function fmtDate(ts) {
    return ts ? new Date(ts).toLocaleDateString() : '—';
  }

  function showLogin() {
    localStorage.removeItem(TOKEN_KEY);
    loginBox.classList.remove('hidden');
    app.classList.add('hidden');
  }

  async function loadStats() {
    const stats = await api('/api/admin/stats');
    $('#cards').innerHTML = [
      ['Users', stats.users],
      ['Chats', stats.chats],
      ['Messages', stats.messages],
      ['Files', stats.files],
      ['Deleted (retained)', stats.deletedMessages],
      ['DB size', fmtBytes(stats.dbSizeBytes)],
      ['Uptime', stats.uptimeSec + 's'],
      ['Live conns', stats.connections],
      ['Captcha fails', stats.captcha ? stats.captcha.failures : 0],
      ['Captchas solved', stats.captcha ? stats.captcha.solved : 0],
    ].map(([lbl, num]) => `<div class="card"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`).join('');

    const btn = $('#btn-reg');
    if (stats.registrationOpen) {
      btn.textContent = 'Close registration';
      btn.className = 'danger';
      btn.onclick = () => setRegistration(false);
    } else {
      btn.textContent = 'Open registration';
      btn.className = '';
      btn.onclick = () => setRegistration(true);
    }

    const sbtn = $('#btn-search-mode');
    if (stats.strictSearch) {
      sbtn.textContent = 'Search: strict ✓';
      sbtn.className = 'ghost';
      sbtn.title = 'Non-admins must type the FULL username or display name. Click to allow substring search.';
      sbtn.onclick = () => setSearchMode(false);
    } else {
      sbtn.textContent = 'Search: loose ⚠';
      sbtn.className = 'danger';
      sbtn.title = 'Users can enumerate accounts by typing partial names. Click to require exact matches.';
      sbtn.onclick = () => setSearchMode(true);
    }

    const cbtn = $('#btn-captcha');
    const cthreshold = $('#captcha-threshold');
    if (stats.captchaEnabled) {
      cbtn.textContent = 'Captcha: on ✓';
      cbtn.className = 'ghost';
      cbtn.title = 'Registration always asks for a captcha; logins after the threshold below. Click to disable.';
      cbtn.onclick = () => setCaptcha({ enabled: false });
    } else {
      cbtn.textContent = 'Captcha: off ⚠';
      cbtn.className = 'danger';
      cbtn.title = 'Scripted signups are unrestricted. Click to enable.';
      cbtn.onclick = () => setCaptcha({ enabled: true });
    }
    if (document.activeElement !== cthreshold) cthreshold.value = String(stats.captchaAfterFailures);
    cthreshold.onchange = () => {
      const n = Math.max(0, Math.min(50, Math.floor(Number(cthreshold.value) || 0)));
      setCaptcha({ afterFailures: n });
    };
  }

  async function setCaptcha(patch) {
    try {
      await api('/api/admin/captcha', { method: 'POST', body: JSON.stringify(patch) });
      await refresh();
      toast(
        patch.enabled === undefined
          ? 'Captcha threshold set'
          : patch.enabled
            ? 'Captcha enabled'
            : 'Captcha disabled — scripted signups are unrestricted',
      );
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function setSearchMode(strict) {
    try {
      await api('/api/admin/search-mode', { method: 'POST', body: JSON.stringify({ strict }) });
      await refresh();
      toast(strict ? 'Strict search on — exact username/display-name match only' : 'Loose search on — partial names can enumerate users');
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function loadUsers() {
    const { users } = await api('/api/admin/users');
    $('#rows').innerHTML = users.map((u) => `
      <tr>
        <td>${u.displayName.replace(/</g, '&lt;')}</td>
        <td>@${u.username.replace(/</g, '&lt;')}</td>
        <td><span class="dot ${u.online ? 'on' : 'off'}"></span>${u.online ? 'online' : 'offline'}</td>
        <td>${fmtAgo(u.lastSeenAt)}</td>
        <td>${fmtDate(u.createdAt)}</td>
        <td style="text-align:right">
          <button data-reset="${u.id}" data-name="${u.username}">Reset password</button>
        </td>
      </tr>`).join('');
    document.querySelectorAll('[data-reset]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const next = prompt('New password for @' + btn.dataset.name + ' (min 8 chars):');
        if (!next) return;
        try {
          const r = await api('/api/admin/users/' + btn.dataset.reset + '/reset-password', {
            method: 'POST',
            body: JSON.stringify({ newPassword: next }),
          });
          toast('Password reset for @' + r.username);
        } catch (e) {
          toast(e.message, true);
        }
      });
    });
  }

  async function refresh() {
    try {
      await loadStats();
      await loadBackups();
      await loadUsers();
    } catch (e) {
      toast(e.message, true);
    }
  }

  // ── backups ──────────────────────────────────────────────────────────
  async function loadBackups() {
    const data = await api('/api/admin/backups');
    $('#backup-schedule').textContent =
      data.intervalHours > 0
        ? `automatic: every ${data.intervalHours}h · keeping ${data.keep}`
        : 'automatic backups disabled';
    const tbody = $('#backup-rows');
    tbody.innerHTML = '';
    if (!data.backups.length) {
      tbody.innerHTML = '<tr><td colspan="4" class="muted" style="padding:10px 8px">No backups yet — take one now.</td></tr>';
      return;
    }
    for (const b of data.backups) {
      const tr = document.createElement('tr');
      const nameTd = document.createElement('td');
      nameTd.textContent = b.name;
      const sizeTd = document.createElement('td');
      sizeTd.textContent = fmtBytes(b.sizeBytes);
      const whenTd = document.createElement('td');
      whenTd.textContent = new Date(b.createdAt).toLocaleString();
      const actions = document.createElement('td');

      const dl = document.createElement('button');
      dl.className = 'ghost';
      dl.textContent = 'Download';
      dl.onclick = () => downloadBackup(b.name);

      const rs = document.createElement('button');
      rs.className = 'danger';
      rs.textContent = 'Restore';
      rs.onclick = () => restoreBackup(b.name);

      const del = document.createElement('button');
      del.className = 'ghost';
      del.textContent = 'Delete';
      del.onclick = () => removeBackup(b.name);

      actions.append(dl, rs, del);
      tr.append(nameTd, sizeTd, whenTd, actions);
      tbody.appendChild(tr);
    }
  }

  async function downloadBackup(name) {
    try {
      const token = localStorage.getItem(TOKEN_KEY);
      const res = await fetch('/api/admin/backups/' + encodeURIComponent(name), {
        headers: { authorization: 'Bearer ' + token },
      });
      if (!res.ok) throw new Error('Download failed (' + res.status + ')');
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      toast('Downloading ' + name);
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function removeBackup(name) {
    if (!confirm('Delete backup ' + name + '?')) return;
    try {
      await api('/api/admin/backups/' + encodeURIComponent(name), { method: 'DELETE' });
      toast('Backup deleted');
      await loadBackups();
    } catch (e) {
      toast(e.message, true);
    }
  }

  async function restoreBackup(name) {
    if (
      !confirm(
        'Restore ' + name + '?\n\n' +
          '· A safety snapshot of the CURRENT data is taken first\n' +
          '· The server restarts on the restored data (~5s downtime)',
      )
    )
      return;
    const typed = prompt('Type RESTORE (capital letters) to confirm:');
    if (typed !== 'RESTORE') {
      toast('Restore cancelled');
      return;
    }
    try {
      const r = await api('/api/admin/restore', {
        method: 'POST',
        body: JSON.stringify({ name, confirm: 'RESTORE' }),
      });
      toast('Restoring… safety snapshot: ' + r.preRestoreBackup);
      for (let i = 0; i < 40; i++) {
        await new Promise((res) => setTimeout(res, 1000));
        const ok = await fetch('/api/health').then((x) => x.ok).catch(() => false);
        if (ok) {
          toast('Restore complete — reloading');
          setTimeout(() => location.reload(), 900);
          return;
        }
      }
      toast('Server has not come back yet — check it manually', true);
    } catch (e) {
      toast(e.message, true);
    }
  }

  $('#btn-backup-now').addEventListener('click', async () => {
    const btn = $('#btn-backup-now');
    btn.disabled = true;
    btn.textContent = 'Backing up…';
    try {
      const r = await api('/api/admin/backups', { method: 'POST' });
      toast('Backup created: ' + r.backup.name);
      await loadBackups();
    } catch (e) {
      toast(e.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Backup now';
    }
  });

  async function setRegistration(enabled) {
    try {
      await api('/api/admin/registration', { method: 'POST', body: JSON.stringify({ enabled }) });
      await refresh();
      toast(enabled ? 'Registration opened' : 'Registration closed');
    } catch (e) {
      toast(e.message, true);
    }
  }

  $('#btn-cleanup').addEventListener('click', async () => {
    const days = Math.max(0, Math.floor(Number($('#cleanup-days').value) || 0));
    if (!confirm('Permanently delete flagged messages older than ' + days + ' day(s)? This cannot be undone.')) return;
    try {
      const r = await api('/api/admin/cleanup-deleted', { method: 'POST', body: JSON.stringify({ days }) });
      toast('Purged ' + r.deleted + ' deleted message(s)');
      await refresh();
    } catch (e) {
      toast(e.message, true);
    }
  });

  $('#a-login').addEventListener('click', async () => {
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: $('#a-user').value, password: $('#a-pass').value }),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Login failed');
      // verify admin rights before storing the token
      localStorage.setItem(TOKEN_KEY, body.token);
      const probe = await api('/api/admin/stats');
      if (probe) {
        loginBox.classList.add('hidden');
        app.classList.remove('hidden');
        await refresh();
        toast('Welcome, admin');
      }
    } catch (e) {
      localStorage.removeItem(TOKEN_KEY);
      toast(e.message, true);
    }
  });
  $('#a-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#a-login').click(); });
  $('#btn-refresh').addEventListener('click', refresh);
  $('#btn-logout').addEventListener('click', showLogin);

  // auto-login if a valid token exists
  if (localStorage.getItem(TOKEN_KEY)) {
    api('/api/admin/stats').then(() => {
      loginBox.classList.add('hidden');
      app.classList.remove('hidden');
      refresh();
    }).catch(() => showLogin());
  }
})();
</script>
</body>
</html>
